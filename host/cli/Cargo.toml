[package]
name = "pichainboot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
pichainboot-proto = { version = "0.1.0", path = "../proto" }
ratatui = "0.30.2"
tcpuart-common = { git = "https://github.com/Sc1pex/tcpuart", package = "common", optional = true }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-util", "io-std", "time", "net", "sync", "signal", "process", "fs"] }
tokio-serial = "5.5.0"
tokio-util = { version = "0.7.19", features = ["codec"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }

[features]
# Connect through a tcpuart daemon (https://github.com/Sc1pex/tcpuart) and reset the device remotely
tcpuart = ["dep:tcpuart-common", "dep:tokio-util", "clap/env"]
